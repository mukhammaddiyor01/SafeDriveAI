[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safedrive-ai"
version = "0.1.0"
description = "SafeDriveAI dataset, training, evaluation, and local voice assistant tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["opencv-python>=4.10,<5", "pandas>=2.2,<4", "ultralytics>=8.3,<9", "torch>=2.5,<3", "torchvision>=0.20,<1"]
assistant = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
